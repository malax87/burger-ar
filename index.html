<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Burger AR Menu</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fff4e6;
    }

    h1 {
      margin-top: 25px;
    }

    model-viewer {
      width: 100%;
      height: 500px;
      background: #fff4e6;
    }

    #ar-button {
      background: #ff7a00;
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>🍔 My Burger</h1>

  <model-viewer
    src="hamburger-060fd6.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    alt="3D Burger">

    <button id="ar-button" slot="ar-button">
      View in AR
    </button>

  </model-viewer>

</body>
</html>
